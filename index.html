<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriveReady: Permit & Road Test</title>
<meta name="description" content="Free DMV permit test and road test practice in 6 languages: English, Español, 中文, Русский, 한국어, বাংলা.">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Señalización vial: verde de autopista, amarillo de aviso, asfalto en oscuro. Fuente por idioma en --body. */
:root{--bg:#f4f6f3;--surface:#fff;--ink:#17201b;--muted:#5b6660;--line:#d9dfda;--accent:#0b6e4f;--accent-ink:#fff;--warn:#f2b705;--ok:#1d7a3a;--bad:#b3261e;
 --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121614;--surface:#1b211e;--ink:#e8ede9;--muted:#9aa6a0;--line:#2e3833;--accent:#2fa77c;--accent-ink:#06140e;--warn:#f2c230;--ok:#4cc277;--bad:#ff7a70;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3,:lang(ko) h1,:lang(ko) h2,:lang(ko) h3,:lang(bn) h1,:lang(bn) h2,:lang(bn) h3,:lang(ru) h1,:lang(ru) h2,:lang(ru) h3{font-family:var(--body);font-weight:700;letter-spacing:0}
button,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
img,video{max-width:100%;display:block}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:26px;line-height:1;font-family:var(--display)!important}
.brand small{display:block;font-size:13px;opacity:.88}
.controls{display:flex;gap:8px;align-items:center}
.controls select,.controls button{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;min-height:38px}
.controls select option{color:#17201b}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:12px 11px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--warn)}
main{padding:18px 0 40px}section.view{display:none}section.view.on{display:block}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.card h2{font-size:24px;margin-bottom:6px}.card h3{font-size:20px;margin-bottom:4px}
.muted{color:var(--muted)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:56px;font-size:17px;padding:14px 18px;flex:1 1 160px}
#onb{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}
#onb[hidden]{display:none}
.onb-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:560px;width:100%}
.onb-card h2{font-size:24px;margin-bottom:8px}
.onb-step{display:flex;gap:8px;margin:10px 0 16px}
.onb-step span{height:6px;flex:1;border-radius:999px;background:var(--line)}
.onb-step span.on{background:var(--accent)}
.onb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.onb-grid button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:52px;font-weight:600}
.onb-grid button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chbar{margin:6px 0}.chbar .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.chbar .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chbar .bar span{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){video{display:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 25%,transparent);border-color:var(--warn)}
/* Anuncios: solo fuera de las preguntas, nunca encima de respuestas */
.ad{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;margin:18px 0;min-height:60px}
.sc-q{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.school{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface)}
.school.sponsored{border:2px solid var(--warn)}
.sp-badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:var(--warn);color:#17201b;border-radius:6px;padding:2px 6px}
.sc-name{font-weight:700;padding-right:80px}
.sc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sc-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.sc-act{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:14px}.sc-act a{color:var(--accent);font-weight:600;text-decoration:none}
.ad:empty{display:none}
.ad.sponsor{border-style:solid;text-align:left;color:var(--ink);background:var(--surface)}
.sp-k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sp-t{font-weight:700;font-size:15px;margin:4px 0}
.sp-b{font-size:13px;color:var(--muted)}
.sp-c{display:inline-block;margin-top:8px;font-weight:700;font-size:13px;color:var(--accent)}
/* Portada */
.hero{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#26302b;margin-bottom:14px}
.hero video,.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.hero .cap{position:absolute;left:16px;right:16px;bottom:14px;color:#fff;z-index:1}
.hero .cap .free{display:inline-block;margin-top:8px;background:#f2b705;color:#17201b;font-weight:700;font-size:14px;border-radius:999px;padding:3px 12px}
.hero .cap h2{font-size:clamp(24px,5vw,38px);line-height:1.08}
.guide{display:flex;gap:12px;align-items:flex-start}
.guide img{width:64px;height:64px;border-radius:50%;flex:none;object-fit:cover;border:3px solid var(--warn);background:#efe7d3}
.bubble{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:4px 14px 14px 14px;padding:10px 12px}
.bubble b{display:block;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fact{border-left:4px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 8%,var(--surface));font-size:14px}
.fact b{font-family:var(--display);font-size:28px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
/* Preguntas */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;flex:1 1 140px}.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.qimg{margin:-16px -16px 12px;aspect-ratio:21/8;overflow:hidden}
.qart{margin:-16px -16px 12px;background:color-mix(in srgb,var(--line) 30%,var(--surface));display:flex;justify-content:center;align-items:center;padding:14px}
.qart svg{width:180px;height:180px}.qimg img{width:100%;height:100%;object-fit:cover}
.qtext{font-size:19px;font-weight:600;margin:6px 0 12px}
.signbox{display:flex;justify-content:center;margin:6px 0 12px}.signbox svg{width:150px;height:150px}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.explain{margin-top:12px}.explain .bubble{font-size:15px}.explain a{color:var(--accent)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.result-big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.review{margin-top:12px;display:grid;gap:8px}.review>div{border-inline-start:4px solid var(--line);padding:6px 10px}
.review .ok{border-color:var(--ok)}.review .bad{border-color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;min-height:40px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gamebar{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}.gamebar b{font-family:var(--display);font-size:30px;display:block;line-height:1}
.rt-cat{margin-top:12px}.rt-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.rt-item:last-child{border-bottom:0}.counter{display:flex;align-items:center;gap:6px}
.counter button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.counter span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.media{border-radius:12px;overflow:hidden;background:#26302b;aspect-ratio:1280/704}.media video,.media img,.media svg{width:100%;height:100%;object-fit:cover}
.scene{background:color-mix(in srgb,var(--line) 40%,var(--surface))}
.car{transition:transform 1.1s ease-in-out}
@media (prefers-reduced-motion:reduce){.car,.progress span{transition:none}}
.steps{margin:10px 0 0;padding-inline-start:20px}.steps li{margin:4px 0;color:var(--muted)}.steps li.now{color:var(--ink);font-weight:600}
.cult{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cult .card{padding:0}.cult img{aspect-ratio:16/9;object-fit:cover;width:100%}.cult .txt{padding:12px 14px 16px}
/* Selector de idioma */
#langPick{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none;padding:24px 16px env(safe-area-inset-bottom)}
#langPick.on{display:block}
#langPick h2{font-size:28px;text-align:center;margin:8px 0 4px}
.lp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:760px;margin:18px auto}
.lp button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lp button img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#efe7d3}
.lp button b{font-size:20px}.lp button span{font-size:13px;color:var(--muted);text-align:center}
.lp button[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

.study{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
@media (min-width:900px){.study{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.side{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}}
.side h3{font-size:18px}.facts-list{margin:8px 0 0;padding-inline-start:18px}.facts-list li{margin:6px 0;font-size:14px;color:var(--muted)}
.facts-list li.hit{color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--warn) 22%,transparent);border-radius:6px;padding:2px 6px;margin-inline-start:-6px}
/* Juego de señales: opciones con el dibujo de la señal */
.signopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.signopt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:center;min-height:104px}
.signopt svg{width:82px;height:82px}
.signopt:hover:not(:disabled){border-color:var(--accent)}
.signopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.signopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}.signgrid div{text-align:center;font-size:13px}.signgrid svg{width:70px;height:70px;display:block;margin:0 auto 4px}
.chcard h3{font-size:22px}.chcard .head{display:flex;gap:12px;align-items:center;margin:-16px -16px 12px;padding:0}.chcard .head img{width:100%;aspect-ratio:21/7;object-fit:cover}
footer{border-top:1px solid var(--line);padding:16px 0 30px;color:var(--muted);font-size:13px}footer a{color:var(--accent)}
/* Aviso legal: visible siempre, en todos los estados e idiomas (política de Google Play). */
.govbar{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45;color:var(--ink)}
.govbar .wrap{padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.govbar span{flex:1 1 320px;min-width:200px}
.govbar a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.govbar b{font-weight:700}
@media (max-width:440px){.brand small{display:none}.qtext{font-size:17px}.facts{grid-template-columns:1fr 1fr 1fr}.fact b{font-size:22px}}
</style>
</head>
<body>
<div id="onb" role="dialog" aria-modal="true" hidden>
  <div class="onb-card"><div id="onbBody"></div></div>
</div>
<div id="langPick" role="dialog" aria-modal="true" aria-label="Language">
  <h2>Choose your language · Elige tu idioma</h2>
  <p class="muted small" style="text-align:center">中文 · Русский · 한국어 · বাংলা</p>
  <div class="lp" id="lpList"></div>
</div>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="5" width="30" height="30" rx="3" transform="rotate(45 20 20)" fill="#f2b705" stroke="#17201b" stroke-width="2"/><circle cx="20" cy="20" r="8" fill="none" stroke="#17201b" stroke-width="2.4"/><circle cx="20" cy="20" r="1.9" fill="#17201b"/><path d="M12 20H28M20 20V28" stroke="#17201b" stroke-width="2.4"/></svg>
    <div><h1>DriveReady <span style="font-size:.6em;background:#f2b705;color:#17201b;border-radius:6px;padding:1px 6px;vertical-align:middle">NY</span></h1><small data-t="tagline"></small></div>
  </div>
  <div class="controls">
    <select id="estado" aria-label="State"><option value="NY" selected>NY</option><option disabled>NJ ·</option><option disabled>FL ·</option><option disabled>TX ·</option></select>
    <button id="langBtn" type="button" aria-haspopup="dialog"></button>
  </div>
</div></header>
<nav class="tabs" aria-label="Menu"><div class="wrap" id="tabs"></div></nav>
<div class="govbar"><div class="wrap">
  <span id="govText"></span>
  <a id="govManual" target="_blank" rel="noopener"></a>
  <a id="govCdl" target="_blank" rel="noopener"></a>
</div></div>
<main class="wrap">
  <section class="view" id="inicio">
    <div class="hero"><video id="heroVid" muted loop playsinline preload="none" poster="img/portada.webp"></video>
      <div class="cap"><h2 data-t="homeTitle"></h2><span class="free" data-t="freeLine"></span></div></div>
    <div class="grid g2">
      <div class="card">
        <div class="guide"><img id="guideImg" alt=""><div class="bubble"><b id="guideName"></b><span id="guideHello"></span></div></div>
        <p data-t="homeLead"></p>
        <div class="facts"><div class="fact"><b id="factTotal">20</b><span data-t="f1"></span></div><div class="fact"><b id="factPass">14</b><span data-t="f2"></span></div><div class="fact" id="factSignsWrap"><b id="factSigns">2/4</b><span data-t="f3"></span></div></div>
        <div class="row" id="homeActions" style="margin-top:14px">
          <a class="btn big" href="#practica" data-t="homeStudy"></a>
          <a class="btn big" href="#examen" data-t="homeExam"></a>
          <a class="btn big ghost" href="#roadtest" data-t="homeRoad"></a>
        </div>
        <button class="btn ghost" id="moreBtn" type="button" data-t="homeMore" aria-expanded="false" style="margin-top:10px"></button>
        <div id="homeMore" class="chips" style="margin-top:10px" hidden></div>
      </div>
      <div class="card">
        <h3 data-t="progressTitle"></h3><div id="stats" class="small"></div><div id="chapterProgress" style="margin-top:10px"></div><p id="readyPill" class="pill" hidden></p>
        <div class="row" style="margin-top:10px"><button class="btn ghost" id="goMistakes" type="button" hidden></button><button class="btn ghost" id="installBtn" type="button" hidden data-t="install"></button></div>
        <h3 style="margin-top:14px" data-t="howTitle"></h3><ol class="small" id="howList" style="padding-inline-start:18px;margin:6px 0 0"></ol>
      </div>
    </div>
    <div class="ad" data-ad></div>
  </section>
  <section class="view" id="examen"><div class="card" id="examCard"></div><div class="ad" data-ad id="examAd" hidden></div></section>
  <section class="view" id="practica">
    <div class="card"><h2 data-t="practiceTitle"></h2><p class="muted small" data-t="practiceLead"></p><div class="chips" id="chapterChips"></div><p class="small" style="margin:10px 0 0"><span class="pill ok" id="masteredPill"></span></p></div>
    <div class="study" style="margin-top:14px"><div class="card" id="practiceCard"></div><aside class="card side" id="practiceSide"></aside></div>
  </section>
  <section class="view" id="manual">
    <div class="card" style="margin-bottom:14px"><h2 data-t="mTitle"></h2><p class="muted small" data-t="mLead"></p><div class="chips" id="manualChips"></div></div>
    <div id="manualList" class="grid"></div>
  </section>
  <section class="view" id="juego"><div class="card" id="gameCard"></div></section>
  <section class="view" id="roadtest">
    <div class="media" style="margin-bottom:14px"><img src="img/roadtest.webp" alt="" loading="lazy"></div>
    <div class="grid g2">
      <div class="card"><h2 data-t="rtTitle"></h2><p data-t="rtLead"></p><p class="small muted" data-t="rtPoints"></p><p class="small"><a id="rtSource" target="_blank" rel="noopener" data-t="rtSourceLink"></a></p></div>
      <div class="card"><h3 data-t="rtSimTitle"></h3><p class="small" data-t="rtSimLead"></p><div id="rtSummary" class="small"></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="rtReset" type="button" data-t="reset"></button></div></div>
    </div>
    <div class="card" id="rtList" style="margin-top:14px"></div>
  </section>
  <section class="view" id="escuelas">
    <div class="card">
      <h2 id="scTitle"></h2><p class="small muted" id="scLead"></p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="scNear" type="button"></button><input id="scQ" type="search" class="sc-q" autocomplete="off"></div>
      <div class="small muted" id="scMsg" role="status"></div>
      <div class="small muted" id="scCount" style="margin-top:8px"></div>
      <div id="scList"></div>
      <button class="btn ghost" id="scMore" type="button" hidden></button>
      <p class="small"><a id="scOwn"></a></p>
      <p class="small muted" id="scNote"></p>
